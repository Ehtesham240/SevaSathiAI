name: Build Debug APK

# Jab bhi 'main' branch par code push hoga, yeh automatically chalega
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Manually bhi "Run workflow" button se chala sakte ho

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout karo
        uses: actions/checkout@v4

      - name: Java 17 setup karo
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK setup karo
        uses: android-actions/setup-android@v3

      - name: Gradle setup karo
        uses: gradle/actions/setup-gradle@v3

      - name: APK build karo (assembleDebug)
        run: gradle assembleDebug

      - name: APK ko upload karo (download ke liye)
        uses: actions/upload-artifact@v4
        with:
          name: SevaSathiAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
